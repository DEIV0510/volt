# Copia diaria de lo publicado en data/site.json:
#  - respaldo versionado en GitHub del contenido y el catálogo publicados;
#  - plan B de la página si Supabase no responde (script.js la usa automáticamente);
#  - mantiene activo el proyecto gratuito de Supabase (se pausa tras días sin uso).
name: Copia diaria del contenido

on:
  schedule:
    - cron: '17 9 * * *'   # 4:17 a. m. hora de Colombia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar lo publicado
        run: |
          curl -sf --retry 3 -X POST "https://rxdokvoljoxtficvbjhc.supabase.co/rest/v1/rpc/get_public_site" \
            -H "apikey: sb_publishable_Sv34Sje2NPVUZEpAWDpzuw_L5X2w7_H" -H "Content-Type: application/json" -d '{}' \
            -o /tmp/site.json
          # Solo se guarda si la respuesta es válida y trae contenido (nunca se reemplaza por algo vacío).
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/site.json'))
          assert isinstance(d.get('content'), dict) and len(d['content']) >= 10, 'contenido incompleto'
          assert isinstance(d.get('products'), list), 'sin catálogo'
          json.dump(d, open('data/site.json', 'w'), ensure_ascii=False, separators=(',', ':'))
          PY

      - name: Guardar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site.json
          git diff --cached --quiet || (git commit -m "Copia diaria del contenido publicado" && git push)
