# Cada hora guarda lo publicado en el panel dentro del repositorio:
#  - data/site.json: respaldo versionado del contenido y el catálogo publicados, y plan B
#    de la página si Supabase no responde (script.js lo usa automáticamente);
#  - index.html: título, descripción, imagen para compartir e indexación del panel
#    (lo que leen Google, WhatsApp y Facebook sin ejecutar JavaScript).
# Si hay cambios, hace commit en main y Hostinger lo publica (despliegue automático por Git).
# También mantiene activo el proyecto gratuito de Supabase.
name: Copia del contenido publicado

on:
  schedule:
    - cron: '17 * * * *'   # cada hora, minuto 17
  workflow_dispatch:       # o al momento: Actions → "Copia del contenido publicado" → Run workflow

permissions:
  contents: write

concurrency:
  group: copia-contenido
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar lo publicado
        run: |
          curl -sf --retry 3 -X POST "https://rxdokvoljoxtficvbjhc.supabase.co/rest/v1/rpc/get_public_site" \
            -H "apikey: sb_publishable_Sv34Sje2NPVUZEpAWDpzuw_L5X2w7_H" -H "Content-Type: application/json" -d '{}' \
            -o /tmp/site.json
          # Solo se guarda si la respuesta es válida y trae contenido (nunca se reemplaza por algo vacío).
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/site.json'))
          assert isinstance(d.get('content'), dict) and len(d['content']) >= 10, 'contenido incompleto'
          assert isinstance(d.get('products'), list), 'sin catálogo'
          json.dump(d, open('data/site.json', 'w'), ensure_ascii=False, separators=(',', ':'))
          PY

      - name: Aplicar el SEO publicado a index.html
        run: node scripts/apply-seo.mjs

      - name: Guardar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site.json index.html
          git diff --cached --quiet || (git commit -m "Copia del contenido publicado" && git push)
