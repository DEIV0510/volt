# Publica el sitio y el panel en Hostinger cada vez que cambia main, sin contraseñas ni secretos.
# El propio sitio descarga de GitHub (repositorio público) el último commit de main y lo instala:
# esta acción solo se lo pide (POST /api/?a=deploy) y comprueba que quedó instalado el commit nuevo.
# Nunca se tocan los datos del panel (volt-data, fuera de public_html) ni las imágenes subidas (uploads/).
# Detalles en api/lib/deploy.php.
name: Publicar en Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pedir al sitio que se actualice desde GitHub
        env:
          SITE: https://voltstoreco.com
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            r=$(curl -sS -m 150 -X POST "$SITE/api/?a=deploy" || true)
            echo "Intento $i: $r"
            sha=$(printf '%s' "$r" | grep -o '"sha":"[0-9a-f]\{40\}"' | cut -d'"' -f4 || true)
            if [ "$sha" = "$GITHUB_SHA" ]; then
              echo "::notice::Sitio actualizado al commit ${GITHUB_SHA:0:7}"
              exit 0
            fi
            # Si main ya avanzó con otro push, la siguiente ejecución instalará esa versión.
            head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
            if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
              echo "::notice::main ya avanzó a ${head:0:7}; lo instalará la siguiente ejecución."
              exit 0
            fi
            sleep 25
          done
          echo "::error::El sitio no confirmó la versión ${GITHUB_SHA:0:7}. Revisa https://voltstoreco.com/api/?a=status"
          exit 1
