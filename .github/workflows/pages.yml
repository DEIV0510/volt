# Publica el panel de administración (y la copia del sitio que usa su vista previa) en GitHub Pages.
# URL del panel: https://deiv0510.github.io/volt/admin/
name: Panel en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}admin/
    steps:
      - uses: actions/checkout@v4

      - name: Preparar archivos
        run: |
          mkdir _site
          cp -r index.html styles.css script.js favicon.svg img data admin _site/
          rm -f _site/admin/package.json
          # La copia del sitio en Pages solo existe para la vista previa del panel: que los buscadores no la indexen.
          sed -i 's|<head>|<head>\n  <meta name="robots" content="noindex, nofollow" />|' _site/index.html
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=admin/"><meta name="robots" content="noindex">' > _site/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
